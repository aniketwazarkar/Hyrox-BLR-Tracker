name: HYROX Bengaluru ticket watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email to verify Gmail setup"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hyrox-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tickets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          FORCE_TEST_EMAIL: ${{ inputs.test_email && '1' || '' }}
        run: python hyrox_watch.py

      - name: Save notified state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "hyrox-watch-bot"
            git config user.email "hyrox-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Record ticket notification"
            git push
          fi
